# Synchronise agenda.ics avec l'agenda de l'APSAL sur l'agenda académique (Calendar 7, CalDAV).
#
# Mise en route (Settings > Secrets and variables > Actions) :
#   - onglet Variables : CALDAV_URL = https://calendar7.ac-lyon.fr/dav/home/<adresse du compte>/<nom de l'agenda>/
#   - onglet Secrets   : CALDAV_USER et CALDAV_PASSWORD (identifiants du compte qui possède l'agenda)
# Variante sans identifiants : une variable AGENDA_ICS_URL pointant vers un export .ics public.
# Tant qu'aucune variable n'existe, le fichier agenda.ics du dépôt reste la référence.
name: Synchroniser l'agenda

on:
  schedule:
    - cron: "*/10 * * * *"   # toutes les 10 minutes (GitHub peut retarder ou sauter des passages)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synchro:
    runs-on: ubuntu-latest
    if: ${{ vars.CALDAV_URL != '' || vars.AGENDA_ICS_URL != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Lire l'agenda académique (CalDAV)
        if: ${{ vars.CALDAV_URL != '' }}
        env:
          CALDAV_URL: ${{ vars.CALDAV_URL }}
          CALDAV_USER: ${{ secrets.CALDAV_USER }}
          CALDAV_PASSWORD: ${{ secrets.CALDAV_PASSWORD }}
        run: python3 _src/synchro_caldav.py
      - name: Lire un export .ics public
        if: ${{ vars.CALDAV_URL == '' && vars.AGENDA_ICS_URL != '' }}
        env:
          URL: ${{ vars.AGENDA_ICS_URL }}
        run: |
          curl -fsSL --retry 3 "$URL" -o agenda.nouveau.ics
          grep -q "BEGIN:VCALENDAR" agenda.nouveau.ics || { echo "Le fichier reçu n'est pas un agenda .ics"; exit 1; }
          mv agenda.nouveau.ics agenda.ics
      - name: Publier si l'agenda a changé
        run: |
          if git diff --quiet agenda.ics; then echo "Agenda inchangé"; exit 0; fi
          git config user.name "apsal-agenda"
          git config user.email "apsal-agenda@users.noreply.github.com"
          git add agenda.ics
          git commit -m "Agenda : synchronisation avec l'agenda académique"
          git push
